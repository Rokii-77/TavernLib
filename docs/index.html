<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛书匣 · 使用教程</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: #f6f7f9;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 920px; margin: 0 auto; }
  .tip {
    margin: 0 0 28px;
    padding: 16px 20px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e4e7ec;
    font-size: 17px;
    text-align: center;
  }
  .tip kbd {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 2px;
    font-family: inherit;
    font-size: 15px;
    background: #f2f3f5;
    border: 1px solid #d7dbe0;
    border-bottom-width: 2px;
    border-radius: 5px;
  }
  figure { margin: 0 0 22px; }
  figure a { display: block; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid #e4e7ec;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .tip { background: #161b22; border-color: #30363d; }
    .tip kbd { background: #21262d; border-color: #3d444d; }
    figure img { border-color: #30363d; background: #161b22; }
  }
</style>
</head>
<body>
<main>
  <p class="tip">电脑版可以直接框选，或者使用 <kbd>Ctrl</kbd> / <kbd>Shift</kbd> 来进行多选</p>

  <figure><a href="1.png" target="_blank" rel="noopener"><img src="1.png" alt="洛书匣教程 1"></a></figure>
  <figure><a href="2.png" target="_blank" rel="noopener"><img src="2.png" alt="洛书匣教程 2" loading="lazy"></a></figure>
  <figure><a href="3.png" target="_blank" rel="noopener"><img src="3.png" alt="洛书匣教程 3" loading="lazy"></a></figure>
  <figure><a href="4.png" target="_blank" rel="noopener"><img src="4.png" alt="洛书匣教程 4" loading="lazy"></a></figure>
  <figure><a href="5.png" target="_blank" rel="noopener"><img src="5.png" alt="洛书匣教程 5" loading="lazy"></a></figure>
  <figure><a href="6.png" target="_blank" rel="noopener"><img src="6.png" alt="洛书匣教程 6" loading="lazy"></a></figure>
</main>
</body>
</html>
